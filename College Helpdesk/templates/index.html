<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>College Helpdesk Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="chat-container">
    <h2>🎓 College Helpdesk Chatbot</h2>
    <div id="chat-box">
      {% for u, b in chats %}
        <div class="msg user"><p>{{ u }}</p></div>
        <div class="msg bot"><p>{{ b }}</p></div>
      {% endfor %}
    </div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Type your question..." required>
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userMsg = input.value;
      appendMessage('user', userMsg);
      input.value = '';

      const res = await fetch('/get', {
        method: 'POST',
        body: new URLSearchParams({ msg: userMsg }),
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
      });
      const data = await res.json();
      appendMessage('bot', data.response);
    });

    function appendMessage(sender, msg) {
      const div = document.createElement('div');
      div.classList.add('msg', sender);
      div.innerHTML = `<p>${msg}</p>`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
